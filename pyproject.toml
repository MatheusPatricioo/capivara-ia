[project]
name = "capivara-ia"
version = "0.1.0"
description = "Autonomous AI agent with a virtual body: a capybara in a 3D world."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["brain/tests"]
pythonpath = ["brain"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
