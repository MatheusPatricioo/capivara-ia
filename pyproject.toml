[project]
name = "capivara-ia"
version = "0.1.0"
description = "Autonomous AI agent with a virtual body: a capybara in a 3D world."
requires-python = ">=3.12"
dependencies = [
    "ddgs",
    "httpx",
    "pillow",
    # PostgreSQL driver (version 3) and its connection pool, for the long-term memory.
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic",
    "pydantic-settings",
    "websockets",
]

[project.optional-dependencies]
# Her voice in the chat (--voz): Piper speaks, faster-whisper listens and sounddevice
# plays and records. Optional, so the text chat works without them.
voice = [
    "faster-whisper",
    "numpy",
    "piper-tts",
    "sounddevice",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The brain runs from source (cd brain; python -m src...), so `pip install .` only
# installs the dependencies. Without this, setuptools guesses the packages, finds
# brain/, world/ and logs/ side by side and refuses to build.
packages = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["brain/tests"]
pythonpath = ["brain"]
markers = [
    "database: needs PostgreSQL from compose.yaml (skipped when it is offline; deselect with -m 'not database')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Voice libraries without type information; their objects are treated as Any.
module = ["faster_whisper", "sounddevice"]
ignore_missing_imports = true
